<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vòng Quay May Mắn - SK Dental</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;align-items:center;
color:white;background:
radial-gradient(circle at 50% 25%,rgba(220,255,226,.95),rgba(150,220,160,.55) 24%,transparent 48%),
radial-gradient(circle at 10% 90%,rgba(205,255,215,.5),transparent 35%),
linear-gradient(135deg,#3d8f48,#79c56f 48%,#4c9d50);
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;
background:radial-gradient(circle at 15% 15%,rgba(255,255,255,.25) 0 2px,transparent 3px),
radial-gradient(circle at 80% 20%,rgba(255,255,255,.2) 0 2px,transparent 3px),
radial-gradient(circle at 20% 70%,rgba(255,255,255,.18) 0 2px,transparent 3px);
background-size:190px 170px,230px 190px,250px 220px}
.page{width:min(1000px,96vw);height:100dvh;display:flex;flex-direction:column;align-items:center;
justify-content:flex-start;padding:25px 20px 15px}
.logo{width:105px;height:105px;border-radius:50%;object-fit:cover;background:white;
box-shadow:0 7px 25px rgba(0,70,20,.25);margin-bottom:8px}
.title{font-size:clamp(25px,4.5vw,48px);font-weight:900;letter-spacing:1px;text-align:center;
text-shadow:0 4px 8px rgba(0,60,20,.25);margin-bottom:5px}
.sparkle{font-size:25px;margin:0 12px;color:#fffbd0}
.wheel-area{position:relative;width:min(720px,88vh,88vw);aspect-ratio:1;margin-top:8px}
canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:0;height:0;
border-left:25px solid transparent;border-right:25px solid transparent;border-top:55px solid #f6c94c;
filter:drop-shadow(0 4px 4px rgba(50,80,0,.35));z-index:5}
.pointer:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff0a1;
left:-9px;top:-53px;box-shadow:0 0 0 5px #e4a82f}
.spin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;height:150px;
border-radius:50%;border:8px solid #f1c347;background:radial-gradient(circle at 35% 30%,#5eae62,#176d30);
color:#fff;font-size:27px;font-weight:900;cursor:pointer;box-shadow:0 8px 25px rgba(0,50,10,.3),inset 0 2px 8px rgba(255,255,255,.2);
z-index:6;transition:.18s}
.spin:hover{transform:translate(-50%,-50%) scale(1.04)}
.spin:disabled{opacity:.7;cursor:not-allowed}
.modal{position:fixed;inset:0;background:rgba(0,40,15,.58);display:none;align-items:center;justify-content:center;
z-index:20;padding:20px}.modal.show{display:flex}
.box{width:min(430px,92vw);background:#fff;border-radius:28px;padding:38px 28px;text-align:center;color:#214d37;
box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .3s ease}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.gift{font-size:58px}.box h2{color:#32834a;font-size:28px;margin:8px 0}
.result{font-size:31px;font-weight:900;margin:18px 0 25px;color:#246b35}
.close{border:0;background:#32834a;color:#fff;padding:13px 35px;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer}

@media(max-height:700px){
.page{padding-top:8px;padding-bottom:8px}
.logo{width:70px;height:70px;margin-bottom:4px}
.title{font-size:24px;margin-bottom:2px}
.wheel-area{width:min(590px,78vh,90vw);margin-top:3px}
.spin{width:105px;height:105px;font-size:21px}
.pointer{border-left-width:19px;border-right-width:19px;border-top-width:43px}
}
@media(max-width:600px){
.page{width:100vw;height:100dvh;min-height:100dvh;padding:10px 7px 7px}
.logo{width:72px;height:72px;margin-bottom:5px}
.title{font-size:22px;line-height:1.1;letter-spacing:.2px;white-space:nowrap;margin-bottom:5px}
.sparkle{font-size:15px;margin:0 4px}
.wheel-area{width:min(94vw,72vh);max-width:520px;margin-top:2px;flex-shrink:0}
.spin{width:92px;height:92px;font-size:19px;border-width:6px}
.pointer{top:-1px;border-left-width:17px;border-right-width:17px;border-top-width:38px}
.pointer:after{width:14px;height:14px;left:-7px;top:-37px}
}
@media(max-width:380px){
.page{padding-top:7px}.logo{width:60px;height:60px}.title{font-size:19px}
.wheel-area{width:93vw}.spin{width:80px;height:80px;font-size:17px}
}
</style>
</head>

<script>
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d');
const prizes=['500.000đ','1.000.000đ','2.000.000đ','3.000.000đ','5.000.000đ','7.000.000đ','8.000.000đ','10.000.000đ'];
const probabilities=[40,30,30,0,0,0,0,0];
const colors=['#dcefd0','#4d9b4f','#dcefd0','#4d9b4f','#dcefd0','#4d9b4f','#dcefd0','#4d9b4f'];
let rotation=0,spinning=false;

function resize(){
const s=Math.min(document.querySelector('.wheel-area').clientWidth,720);
canvas.width=s*2;canvas.height=s*2;canvas.style.width=s+'px';canvas.style.height=s+'px';draw();
}
window.addEventListener('resize',resize);

function drawMoneyIcon(x,y,size,light){
  ctx.save();
  ctx.translate(x,y);
  ctx.shadowColor='rgba(0,55,20,.20)';
  ctx.shadowBlur=size*.16;

  const w=size*1.55, h=size*.82;
  const green=light ? '#4f9b4b' : '#d9f0c8';
  const dark=light ? '#2e7337' : '#4f9650';
  const pale=light ? '#9ed183' : '#eef8e6';

  // Tờ tiền đô la
  ctx.fillStyle=green;
  ctx.strokeStyle=dark;
  ctx.lineWidth=Math.max(1.5,size*.055);
  ctx.beginPath();
  ctx.roundRect(-w/2,-h/2,w,h,size*.13);
  ctx.fill();ctx.stroke();

  // Họa tiết viền bên trong
  ctx.shadowBlur=0;
  ctx.strokeStyle=pale;
  ctx.lineWidth=Math.max(1,size*.035);
  ctx.beginPath();
  ctx.roundRect(-w*.40,-h*.32,w*.80,h*.64,size*.08);
  ctx.stroke();

  // Góc tờ tiền
  ctx.fillStyle=pale;
  ctx.font=`700 ${size*.18}px Arial`;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('$',-w*.34,-h*.22);
  ctx.fillText('$', w*.34, h*.22);

  // Hình tròn + $
  ctx.fillStyle=dark;
  ctx.beginPath();
  ctx.arc(0,0,size*.25,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle='#fff8cf';
  ctx.font=`900 ${size*.34}px Arial`;
  ctx.fillText('$',0,1);

  ctx.restore();
}
function draw(){
const cx=canvas.width/2,cy=canvas.height/2,r=canvas.width/2-12,slice=Math.PI*2/prizes.length;
ctx.clearRect(0,0,canvas.width,canvas.height);

// Viền xanh đậm + viền vàng mảnh, tạo cảm giác cao cấp
ctx.beginPath();ctx.arc(cx,cy,r+8,0,Math.PI*2);ctx.fillStyle='#0f5428';ctx.fill();
ctx.beginPath();ctx.arc(cx,cy,r+4,0,Math.PI*2);ctx.strokeStyle='#d8b24a';ctx.lineWidth=Math.max(3,canvas.width/150);ctx.stroke();
ctx.beginPath();ctx.arc(cx,cy,r-4,0,Math.PI*2);ctx.strokeStyle='rgba(255,248,190,.55)';ctx.lineWidth=Math.max(2,canvas.width/260);ctx.stroke();

for(let i=0;i<prizes.length;i++){
const a=rotation+i*slice,b=a+slice;
ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,b);ctx.closePath();
ctx.fillStyle=colors[i];ctx.fill();ctx.strokeStyle='#276f35';ctx.lineWidth=5;ctx.stroke();
ctx.save();
const mid=a+slice/2;

// Tọa độ theo tâm ô, nhưng KHÔNG xoay chữ.
// Nhờ vậy số tiền luôn nằm ngang, dễ đọc trên điện thoại.
const textRadius=r*.66;
const tx=Math.cos(mid)*textRadius;
const ty=Math.sin(mid)*textRadius;

ctx.translate(cx,cy);
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.fillStyle=i%2===0?'#17652d':'#fff';
const fontSize=Math.max(17,Math.min(27,canvas.width/27));
ctx.font=`900 ${fontSize}px Arial`;
ctx.shadowColor='rgba(0,0,0,.14)';
ctx.shadowBlur=3;
ctx.fillText(prizes[i],tx,ty);
ctx.shadowBlur=0;

// ICON TIỀN MẶC ĐỊNH: luôn nằm ngay BÊN DƯỚI số tiền,
// căn giữa theo cùng một trục X, không xoay theo ô.
const iconGap = Math.max(22, fontSize * 1.25);
const ix = tx;
const iy = ty + iconGap;
const iconSize = Math.max(18, Math.min(27, canvas.width / 37));
drawMoneyIcon(ix, iy, iconSize, i%2===0);
ctx.restore();
}

// Bóng đèn quanh viền
for(let i=0;i<32;i++){
const a=i*Math.PI*2/32,x=cx+Math.cos(a)*(r+1),y=cy+Math.sin(a)*(r+1);
ctx.beginPath();ctx.arc(x,y,canvas.width/105,0,Math.PI*2);
ctx.fillStyle='#fff6b0';ctx.shadowColor='#fff8b0';ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;
}
}
function winner(){
let x=Math.random()*100,sum=0;
for(let i=0;i<probabilities.length;i++){sum+=probabilities[i];if(x<sum)return i}
return 0;
}

function spinWheel(){
if(spinning)return;
spinning=true;document.getElementById('spin').disabled=true;

const index=winner(),slice=Math.PI*2/prizes.length;
const target=-Math.PI/2-index*slice-slice/2;
const fullTurn=Math.PI*2;

// Chuẩn hóa góc hiện tại để các lượt quay sau không bị tích lũy sai góc.
const currentNormalized=((rotation%fullTurn)+fullTurn)%fullTurn;

// Tính khoảng cách đến ô kết quả từ đúng vị trí hiện tại.
let delta=target-currentNormalized;
delta=((delta%fullTurn)+fullTurn)%fullTurn;

// MỖI LƯỢT đều quay 6-8 vòng hoàn chỉnh trước khi dừng.
const extraTurns=6+Math.floor(Math.random()*3);
const start=currentNormalized;
const final=start+extraTurns*fullTurn+delta;

const t0=performance.now(),duration=5200;

function animate(t){
const p=Math.min((t-t0)/duration,1),ease=1-Math.pow(1-p,4);
rotation=start+(final-start)*ease;draw();
if(p<1)requestAnimationFrame(animate);
else{
rotation=((final%fullTurn)+fullTurn)%fullTurn;draw();
spinning=false;document.getElementById('spin').disabled=false;
document.getElementById('result').textContent='🎁 '+prizes[index];
document.getElementById('modal').classList.add('show');
}
}
requestAnimationFrame(animate);
}

function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('spin').addEventListener('click',spinWheel);
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
resize();
</script>

<div class="title"><span class="sparkle">✦</span> VÒNG QUAY MAY MẮN <span class="sparkle">✦</span></div>
<div class="wheel-area">
<div class="pointer"></div>
<canvas id="wheel"></canvas>
<button id="spin" class="spin">QUAY</button>
</div>
</div>

<div id="modal" class="modal">
<div class="box"><div class="gift">🎉</div><h2>CHÚC MỪNG BẠN!</h2>
<div class="result" id="result"></div><button class="close" onclick="closeModal()">TUYỆT VỜI!</button></div>
</div>

<script>
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d');
const prizes=['500.000đ','1.000.000đ','2.000.000đ','3.000.000đ','5.000.000đ','7.000.000đ','8.000.000đ','10.000.000đ'];
const probabilities=[40,30,30,0,0,0,0,0];
const colors=['#dcefd0','#4d9b4f','#dcefd0','#4d9b4f','#dcefd0','#4d9b4f','#dcefd0','#4d9b4f'];
let rotation=0,spinning=false;

function resize(){
const s=Math.min(document.querySelector('.wheel-area').clientWidth,720);
canvas.width=s*2;canvas.height=s*2;canvas.style.width=s+'px';canvas.style.height=s+'px';draw();
}
window.addEventListener('resize',resize);

function drawMoneyIcon(x,y,size,light){
  ctx.save();
  ctx.translate(x,y);
  ctx.shadowColor='rgba(0,55,20,.20)';
  ctx.shadowBlur=size*.16;

  const w=size*1.55, h=size*.82;
  const green=light ? '#4f9b4b' : '#d9f0c8';
  const dark=light ? '#2e7337' : '#4f9650';
  const pale=light ? '#9ed183' : '#eef8e6';

  // Tờ tiền đô la
  ctx.fillStyle=green;
  ctx.strokeStyle=dark;
  ctx.lineWidth=Math.max(1.5,size*.055);
  ctx.beginPath();
  ctx.roundRect(-w/2,-h/2,w,h,size*.13);
  ctx.fill();ctx.stroke();

  // Họa tiết viền bên trong
  ctx.shadowBlur=0;
  ctx.strokeStyle=pale;
  ctx.lineWidth=Math.max(1,size*.035);
  ctx.beginPath();
  ctx.roundRect(-w*.40,-h*.32,w*.80,h*.64,size*.08);
  ctx.stroke();

  // Góc tờ tiền
  ctx.fillStyle=pale;
  ctx.font=`700 ${size*.18}px Arial`;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('$',-w*.34,-h*.22);
  ctx.fillText('$', w*.34, h*.22);

  // Hình tròn + $
  ctx.fillStyle=dark;
  ctx.beginPath();
  ctx.arc(0,0,size*.25,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle='#fff8cf';
  ctx.font=`900 ${size*.34}px Arial`;
  ctx.fillText('$',0,1);

  ctx.restore();
}
function draw(){
const cx=canvas.width/2,cy=canvas.height/2,r=canvas.width/2-12,slice=Math.PI*2/prizes.length;
ctx.clearRect(0,0,canvas.width,canvas.height);

// Viền xanh đậm + viền vàng mảnh, tạo cảm giác cao cấp
ctx.beginPath();ctx.arc(cx,cy,r+8,0,Math.PI*2);ctx.fillStyle='#0f5428';ctx.fill();
ctx.beginPath();ctx.arc(cx,cy,r+4,0,Math.PI*2);ctx.strokeStyle='#d8b24a';ctx.lineWidth=Math.max(3,canvas.width/150);ctx.stroke();
ctx.beginPath();ctx.arc(cx,cy,r-4,0,Math.PI*2);ctx.strokeStyle='rgba(255,248,190,.55)';ctx.lineWidth=Math.max(2,canvas.width/260);ctx.stroke();

for(let i=0;i<prizes.length;i++){
const a=rotation+i*slice,b=a+slice;
ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,b);ctx.closePath();
ctx.fillStyle=colors[i];ctx.fill();ctx.strokeStyle='#276f35';ctx.lineWidth=5;ctx.stroke();
ctx.save();
const mid=a+slice/2;

// Tọa độ theo tâm ô, nhưng KHÔNG xoay chữ.
// Nhờ vậy số tiền luôn nằm ngang, dễ đọc trên điện thoại.
const textRadius=r*.66;
const tx=Math.cos(mid)*textRadius;
const ty=Math.sin(mid)*textRadius;

ctx.translate(cx,cy);
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.fillStyle=i%2===0?'#17652d':'#fff';
const fontSize=Math.max(17,Math.min(27,canvas.width/27));
ctx.font=`900 ${fontSize}px Arial`;
ctx.shadowColor='rgba(0,0,0,.14)';
ctx.shadowBlur=3;
ctx.fillText(prizes[i],tx,ty);
ctx.shadowBlur=0;

// ICON TIỀN MẶC ĐỊNH: luôn nằm ngay BÊN DƯỚI số tiền,
// căn giữa theo cùng một trục X, không xoay theo ô.
const iconGap = Math.max(22, fontSize * 1.25);
const ix = tx;
const iy = ty + iconGap;
const iconSize = Math.max(18, Math.min(27, canvas.width / 37));
drawMoneyIcon(ix, iy, iconSize, i%2===0);
ctx.restore();
}

// Bóng đèn quanh viền
for(let i=0;i<32;i++){
const a=i*Math.PI*2/32,x=cx+Math.cos(a)*(r+1),y=cy+Math.sin(a)*(r+1);
ctx.beginPath();ctx.arc(x,y,canvas.width/105,0,Math.PI*2);
ctx.fillStyle='#fff6b0';ctx.shadowColor='#fff8b0';ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;
}
}
function winner(){
let x=Math.random()*100,sum=0;
for(let i=0;i<probabilities.length;i++){sum+=probabilities[i];if(x<sum)return i}
return 0;
}

function spinWheel(){
if(spinning)return;
spinning=true;document.getElementById('spin').disabled=true;

const index=winner(),slice=Math.PI*2/prizes.length;
const target=-Math.PI/2-index*slice-slice/2;
const fullTurn=Math.PI*2;

// Chuẩn hóa góc hiện tại để các lượt quay sau không bị tích lũy sai góc.
const currentNormalized=((rotation%fullTurn)+fullTurn)%fullTurn;

// Tính khoảng cách đến ô kết quả từ đúng vị trí hiện tại.
let delta=target-currentNormalized;
delta=((delta%fullTurn)+fullTurn)%fullTurn;

// MỖI LƯỢT đều quay 6-8 vòng hoàn chỉnh trước khi dừng.
const extraTurns=6+Math.floor(Math.random()*3);
const start=currentNormalized;
const final=start+extraTurns*fullTurn+delta;

const t0=performance.now(),duration=5200;

function animate(t){
const p=Math.min((t-t0)/duration,1),ease=1-Math.pow(1-p,4);
rotation=start+(final-start)*ease;draw();
if(p<1)requestAnimationFrame(animate);
else{
rotation=((final%fullTurn)+fullTurn)%fullTurn;draw();
spinning=false;document.getElementById('spin').disabled=false;
document.getElementById('result').textContent='🎁 '+prizes[index];
document.getElementById('modal').classList.add('show');
}
}
requestAnimationFrame(animate);
}

function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('spin').addEventListener('click',spinWheel);
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
resize();
</script>
</body>
